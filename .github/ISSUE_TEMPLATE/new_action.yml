name: 新动作建议
description: 提议一张新的动作卡、风格或表情包
labels: [content]
body:
  - type: input
    id: phrase
    attributes:
      label: 聊天里会怎么说
      placeholder: 翻车了
    validations:
      required: true
  - type: textarea
    id: beats
    attributes:
      label: 三拍怎么演
      description: 写看得见的动作。缩到聊天大小，陌生人也要能说出它在做什么。
      value: |
        起势：
        爆点：
        回环：
    validations:
      required: true
  - type: dropdown
    id: gag
    attributes:
      label: 笑点机制
      options: [反差, 升级, 崩坏, 冷面, 反转, 字面, 尺度, 真诚, 不确定]
  - type: checkboxes
    id: rules
    attributes:
      label: 内容边界
      options:
        - label: 不涉及真实名人形象或现成 IP，也不含粗口、色情或针对具体人的攻击
          required: true
